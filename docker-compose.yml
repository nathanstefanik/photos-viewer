services:
  viewer:
    build: .
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - TOKENS_DB_PATH=/data/tokens.db
    volumes:
      # Host bind mount so access codes + comments/reactions survive rebuilds
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
