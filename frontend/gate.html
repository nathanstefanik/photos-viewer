<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos</title>
  <link rel="icon" href="favicon-32.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gate.css">
  <script src="js/theme-init.js"></script>
</head>
<body>
  <main class="gate">
    <img class="logo-mark" src="immich-logo.svg" alt="">
    <h1>Photos</h1>
    <p>Enter the 6-character code you were given.</p>
    <form id="form">
      <input id="code" name="code" maxlength="7" placeholder="ABC-DEF" autocomplete="off" autofocus>
      <button type="submit">Go</button>
    </form>
    <p class="err" id="err" hidden>That code is invalid or has been revoked.</p>
  </main>
  <script src="js/gate.js"></script>
</body>
</html>
